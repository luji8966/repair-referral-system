<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scan Referral QR</title>
</head>

<body>

    <p>
        <a href="{{ url_for('dashboard') }}">
            <button type="button">← Back to Dashboard</button>
        </a>
    </p>

    <h1>Scan Referral QR</h1>

    <p>
        Scan a member's referral QR code to identify the referring member.
    </p>

    <div id="reader"></div>

    <p>
        <button
            id="start-camera"
            type="button"
            onclick="startCamera()"
        >
            📷 打开摄像头扫码
        </button>

        <button
            id="stop-camera"
            type="button"
            onclick="stopCamera()"
            style="display: none;"
        >
            关闭摄像头
        </button>
    </p>

    <p>
        或者上传二维码图片：
    </p>

    <input
        type="file"
        accept="image/*"
        onchange="scanImage(event)"
    >

    <script src="https://unpkg.com/html5-qrcode"></script>

    <script>
        const html5QrCode = new Html5Qrcode("reader");
        let scanning = false;

        function handleScannedCode(decodedText) {
            try {
                const url = new URL(decodedText);
                const parts = url.pathname.split("/").filter(Boolean);

                if (parts.length !== 2 || parts[0] !== "ref") {
                    alert("无效的推荐二维码");
                    return;
                }

                const referralToken = parts[1];

                window.location.href =
                    "/ref/" + encodeURIComponent(referralToken);

            } catch (error) {
                alert("无效的推荐二维码");
            }
        }

        async function startCamera() {
            if (scanning) {
                return;
            }

            try {
                await html5QrCode.start(
                    { facingMode: "environment" },
                    {
                        fps: 10,
                        qrbox: {
                            width: 250,
                            height: 250
                        }
                    },
                    handleScannedCode
                );

                scanning = true;

                document.getElementById("start-camera").style.display = "none";
                document.getElementById("stop-camera").style.display = "inline-block";

            } catch (error) {
                console.error(error);
                alert("无法打开摄像头，请检查浏览器摄像头权限。");
            }
        }

        async function stopCamera() {
            if (!scanning) {
                return;
            }

            await html5QrCode.stop();

            scanning = false;

            document.getElementById("start-camera").style.display = "inline-block";
            document.getElementById("stop-camera").style.display = "none";
        }

        async function scanImage(event) {
            const file = event.target.files[0];

            if (!file) {
                return;
            }

            try {
                if (scanning) {
                    await html5QrCode.stop();
                    scanning = false;
                }

                const decodedText = await html5QrCode.scanFile(file, true);

                handleScannedCode(decodedText);

            } catch (error) {
                console.error(error);
                alert("无法识别这张图片中的二维码。");
            }
        }
    </script>

</body>
</html>
