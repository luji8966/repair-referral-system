<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff - Add Referral</title>
</head>

<body>

    <h1>Add Referral</h1>

    <form method="POST">

        <label>Referral Code:</label>
        <input type="text" name="invite_code" required>

        <br><br>

        <label>Customer Spend (£):</label>
        <input type="number" name="amount" step="0.01" min="0.01" required>

        <br><br>

        <button type="submit">Confirm Referral</button>

    </form>

</body>
</html>
