<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>推荐会员识别结果</title>
</head>

<body>

    <p>
        <a href="{{ url_for('dashboard') }}">
            <button type="button">← 返回控制台</button>
        </a>
    </p>

    <h2>推荐会员识别成功</h2>

    <p>
        <strong>会员编号：</strong>
        {{ member.id }}
    </p>

    <p>
        <strong>昵称：</strong>
        {{ member.nickname or "未填写" }}
    </p>

    <p>
        <strong>手机号：</strong>
        {{ member.phone or "未填写" }}
    </p>

    <p>
        <strong>微信号：</strong>
        {{ member.wechat or "未填写" }}
    </p>

    <p>
        <strong>邀请码：</strong>
        {{ member.invite_code }}
    </p>

    <a href="{{ url_for('staff', invite_code=member.invite_code) }}">
        <button type="button">录入本次消费</button>
    </a>

</body>
</html>
